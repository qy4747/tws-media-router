; Agent-managed configuration. Defaults preserve the verified NetEase behavior.

[player]
provider=netease
gsmtc_poll_interval_ms=500

[detector]
command=npm start
poll_interval_ms=100

[transcription_shortcut]
press={LCtrl down}{LAlt down}{Up down}
release={Up up}{LAlt up}{LCtrl up}
hold_ms=50

[clear]
select=^a
delete={Backspace}
delay_ms=30

; Future audio-level detection is intentionally disabled and not wired into runtime.
; An adapting agent may implement provider=audio_level with this conservative contract:
;   peak > threshold                         -> Playing
;   peak <= threshold continuously for hold -> Idle
;   device/API unavailable or indeterminate -> Unknown (fail-open)
; Suggested future settings:
; [audio_level]
; enabled=false
; device=default
; threshold=0.02
; idle_after_ms=1000
