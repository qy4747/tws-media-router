name: Windows tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "tws-media-router-ci" }
          $release = Invoke-RestMethod https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^AutoHotkey_2\..*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "AutoHotkey v2 zip asset not found" }
          Invoke-WebRequest $asset.browser_download_url -Headers $headers -OutFile ahk-v2.zip
          Expand-Archive ahk-v2.zip -DestinationPath .ahk

      - name: Run AutoHotkey routing tests
        shell: pwsh
        run: |
          $ahk = Get-ChildItem .ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $ahk) { throw "AutoHotkey64.exe not found" }
          & $ahk.FullName /ErrorStdOut test\router-state.test.ahk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
