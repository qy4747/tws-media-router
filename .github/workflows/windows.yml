name: Windows tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.autohotkey.com/download/ahk-v2.zip -OutFile ahk-v2.zip
          Expand-Archive ahk-v2.zip -DestinationPath .ahk

      - name: Run AutoHotkey routing tests
        shell: pwsh
        run: |
          $ahk = Get-ChildItem .ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $ahk) { throw "AutoHotkey64.exe not found" }
          & $ahk.FullName /ErrorStdOut test\router-state.test.ahk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
